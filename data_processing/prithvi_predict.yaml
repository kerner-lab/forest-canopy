# Prithvi-EO-2.0 (300M) embedding generation for the unified pipeline.
#
# Same `rslearn model predict` structure as your OLMo model-gpu.yaml, but the encoder is
# rslearn's built-in PrithviV2 wrapper. Run via unified_embedding_pipeline.py --do-prithvi
# --prithvi-model-config data_processing/prithvi_predict.yaml  (it sets DATASET_PATH and
# then exports healpix_<id>_prithvi.npz aligned to the GEDI grid).
#
# Decisions baked in (from the build discussion): 300M model, 3 seasonal frames.
#
# SPEED + RESOLUTION (why crop_size is 672, not 224):
#   Prithvi-EO-2.0 was pretrained on 30 m HLS, but the shared dataset is materialized at
#   10 m (and we do NOT want to re-materialize / write a second copy on the HPC). So we
#   downsample to 30 m ON THE FLY at predict time, for free:
#     - We read 672 px (= 3 * img_size) crops from the existing 10 m imagery. Each crop
#       covers 672 * 10 m = 6720 m of ground.
#     - PrithviV2._resize_data() ALWAYS bilinearly interpolates every crop to img_size
#       (224) before patchifying (rslearn/models/prithvi.py). 6720 m squeezed into 224
#       model pixels => 30 m effective GSD — Prithvi's native scale — computed in-memory
#       on the GPU, nothing saved to disk.
#     - Because each crop now covers 9x the ground (3x per side), the sliding window emits
#       ~9x FEWER crops per healpix tile => ~9x fewer 300M-ViT forward passes. This is the
#       dominant speedup; it is why per-tile Prithvi was slow (10 m crops = ~9x more crops,
#       each a full 300M forward, and out of the model's trained distribution).
#   CONSEQUENCE — coarser OUTPUT grid: with patch_size 16 at the 30 m effective GSD, each
#   embedding token now covers 16 * 30 m = 480 m (was 16 * 10 m = 160 m at the old, wrong
#   scale). export_tile reprojects these onto the GEDI grid regardless; they are simply
#   coarser. This is inherent to a patch-16 ViT run at its native 30 m — you cannot get
#   both native-scale input and fine output without overlapping/padded inference.
#
# THREE THINGS TO VERIFY against your installed rslearn (clearly flagged below):
#   1. prithvi_embeddings `num_bands` in the dataset config must equal what PrithviV2
#      actually writes (1024 vs 11*1024 — its forward concatenates per-block features but
#      get_backbone_channels() reports 1024). If predict errors on a band-count mismatch,
#      read the written geotiff's band count and set PRITHVI_EMB_DIM accordingly.
#   2. crop_size = 3 * img_size (672 = 3 * 224). If your config["img_size"] != 224, set
#      crop_size = 3 * img_size and downsample_factor = crop_size * patch_size / img_size.
#   3. merger downsample_factor = crop_size * patch_size / img_size = 672 * 16 / 224 = 48
#      (output res = window res / ... i.e. 10 m * 48 = 480 m). merger overlap_pixels =
#      predict_config.overlap_pixels / downsample_factor.

model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslearn.models.singletask.SingleTaskModel
      init_args:
        encoder:
          - class_path: rslearn.models.prithvi.PrithviV2
            init_args:
              size: VIT_300        # 300M (decision); use VIT_600 for the 600M model
              num_frames: 3        # 3 seasonal frames (decision)
        decoder:
          - class_path: rslearn.train.tasks.embedding.EmbeddingHead
    optimizer:
      class_path: rslearn.train.optimizer.AdamW   # unused at predict, but required

data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: ${DATASET_PATH}
    inputs:
      # MUST be named "image" — PrithviV2.INPUT_KEY. Three monthly mosaics spread across
      # the year approximate seasonal frames (true seasonal medians would need a
      # compositing step). load_all_layers stacks them into the temporal axis (num_frames=3).
      image:
        data_type: "raster"
        layers: ["sentinel2_l2a.3", "sentinel2_l2a.6", "sentinel2_l2a.9"]  # ~Apr / Jul / Oct
        # Prithvi-EO-2.0 HLS 6-band order: Blue, Green, Red, Narrow-NIR, SWIR1, SWIR2.
        bands: ["B02", "B03", "B04", "B8A", "B11", "B12"]
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
    task:
      class_path: rslearn.train.tasks.embedding.EmbeddingTask
    # batch_size 1 (deliberately tiny). Each 672x672 crop is ~9x the RAM of a 224 crop
    # (~65 MB as float32 x 6 bands x 3 frames). The old crop_size=224 full runs used
    # batch_size 8 (~58 MB/batch) and fit this GPU-shared node's system-RAM slice; a
    # 672-crop batch of 1 (~65 MB/batch) reproduces that same footprint. batch_size 16
    # OOM-KILLED the node (cgroup oom on SYSTEM RAM, not CUDA VRAM). With only ~8 crops
    # per tile now, a bigger batch buys ~nothing on throughput — only raise it (to 2-4)
    # if you have confirmed RAM headroom.
    batch_size: 1
    num_workers: 5   # GPU-shared gives ~5 cores/GPU; higher oversubscribes
    predict_config:
      transforms:
        - class_path: rslearn.models.prithvi.PrithviNormalize
          init_args:
            size: VIT_300
      load_all_crops: true
      # 672 = 3 * img_size(224): read 3x-wider crops of the 10 m imagery so PrithviV2's
      # internal resize downsamples them to 30 m GSD (see header). ~9x fewer crops/tile.
      crop_size: 672
      # Overlap dropped 32 -> 0: no redundant edge recompute (fastest). Adjacent 480 m
      # patches abut exactly. If crop-boundary seams show up in the embeddings, set this
      # to 96 and merger.overlap_pixels to 2 (96 / downsample_factor 48).
      overlap_pixels: 0

trainer:
  # Single-device predict on the HPC GPU node. `strategy: auto` + `devices: 1`
  # avoids DDP for a single GPU. accelerator: gpu FORCES CUDA — if no GPU is visible
  # the run errors out rather than silently falling back to CPU (which would be the
  # other, catastrophic, reason "Prithvi is slow"). Confirm the job landed on a GPU:
  # the predict log prints `GPU available: True ... LOCAL_RANK: 0 - CUDA_VISIBLE_DEVICES`.
  # (For a local CPU smoke test on Apple Silicon set `accelerator: cpu` — Lightning
  # otherwise auto-selects MPS, and rslearn's default DDP strategy is unsupported on MPS.)
  accelerator: gpu
  devices: 1
  strategy: auto
  callbacks:
    - class_path: rslearn.train.prediction_writer.RslearnWriter
      init_args:
        output_layer: prithvi_embeddings   # matches PRITHVI_EMB_LAYER in the dataset config
        merger:
          class_path: rslearn.train.prediction_writer.RasterMerger
          init_args:
            overlap_pixels: 0     # = predict_config.overlap_pixels(0) / downsample_factor
            downsample_factor: 48 # = crop_size(672) * patch_size(16) / img_size(224); out res = 10 m * 48 = 480 m
